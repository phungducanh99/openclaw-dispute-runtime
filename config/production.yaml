  runtime_root: "2026 Dispute/openclaw_runtime"
  store_raw_query_data: false
  store_normalized_snapshot_only: true
  store_latest_analysis_only: true
  retention_policy:
    state_files: "keep_latest"
    run_logs: "rotate_30d"
    debug_artifacts: "disabled_by_default"

